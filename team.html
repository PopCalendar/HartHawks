<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team — Hart Hawks Baseball</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .class-roster { display: grid; gap: 28px; }
  .class-group { background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--red); }
  .class-head {
    display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px;
    padding: 16px 22px; background: var(--black); color: #fff;
  }
  .class-head h2 { margin: 0; color: #fff; font-family: 'Oswald', sans-serif; font-size: 1.6rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .class-head p { margin: 0; color: #d8d3c8; font-size: 0.95rem; letter-spacing: 0.04em; }
  .class-names {
    list-style: none; margin: 0; padding: 14px 22px 20px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); column-gap: 24px;
  }
  .class-names li { padding: 9px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
  .class-num { color: var(--red); margin-right: 8px; font-family: 'Oswald', sans-serif; }
  .class-pos { display: block; color: var(--muted); font-weight: 500; font-size: 0.85rem; }
  .roster-scroll { overflow-x: auto; }
  .roster-note { margin: 28px auto 0; text-align: center; color: var(--muted); max-width: none; }
  @media (max-width: 560px) {
    .class-head { padding: 14px 16px; }
    .class-names { padding: 8px 16px 14px; grid-template-columns: 1fr 1fr; column-gap: 14px; }
    .class-names li { font-size: 0.95rem; }
  }
</style>
</head>
