<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule — Hart Hawks Baseball</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .schedule-hero-wrap {
    background:
      linear-gradient(rgba(8,8,8,0.62), rgba(8,8,8,0.78)),
      url('assets/schedule-background.jpg') center/cover no-repeat fixed;
  }
  .schedule-hero-wrap .page-header { background: transparent; }
  .schedule-hero-wrap .section { background: transparent; padding: 56px 0 72px; }
  .schedule-hero-wrap .team-tab { color: #f0ede6; }
  .schedule-hero-wrap .team-tab.active { color: #fff; border-bottom-color: var(--red); }
  .schedule-hero-wrap .team-tabs { border-bottom-color: rgba(255,255,255,0.35); }
  .schedule-hero-wrap .schedule-toolbar .month-label { color: #fff; }
  @media (max-width: 900px) {
    .schedule-hero-wrap { background-attachment: scroll; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="Hart Hawks logo">
      <span class="brand-text">HART HAWKS<small>Baseball</small></span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu">Menu</button>
    <nav class="primary-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="schedule.html" class="active">Schedule</a></li>
        <li><a href="team.html">Team</a></li>
        <li><a href="coaches.html">Coaches</a></li>
        <li><a href="stats.html">Stats</a></li>
        <li class="has-dropdown">
          <a href="#">Hart Pride ▾</a>
          <div class="dropdown">
            <a href="photo-gallery.html">Photo Gallery</a>
            <a href="press-room.html">Press Room</a>
            <a href="alumni.html">Alumni</a>
            <a href="tradition-of-champions.html">Tradition of Champions</a>
            <a href="history.html">History</a>
            <a href="archived-clippings.html">Archived Clippings</a>
          </div>
        </li>
        <li class="has-dropdown">
          <a href="#">Support ▾</a>
          <div class="dropdown">
            <a href="dugout-club.html">Dugout Club</a>
            <a href="gear.html">Gear</a>
          </div>
        </li>
      </ul>
    </nav>
  </div>
</header>

<div class="schedule-hero-wrap">
  <div class="page-header">
    <div class="container">
      <h1>Schedule</h1>
    </div>
  </div>

  <div class="section">
    <div class="container">

      <div class="team-tabs">
        <button class="team-tab active" data-team="Varsity">Varsity</button>
        <button class="team-tab" data-team="JV">JV</button>
        <button class="team-tab" data-team="Freshman">Freshman</button>
      </div>

      <div class="schedule-toolbar">
        <div class="month-label">Month Year</div>
        <div class="month-nav">
          <button id="prevMonth">← Prev</button>
          <button id="nextMonth">Next →</button>
        </div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>

      <div class="schedule-list">
        <div class="section-head">
          <h2>Full season list</h2>
          <span class="tag">ALL GAMES</span>
        </div>
        <div id="scheduleList"></div>
      </div>

    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="brand-text" style="color:#fff;">HART HAWKS BASEBALL</div>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/schedule.js"></script>
</body>
</html>
