<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coaches — Hart Hawks Baseball</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .coaches-hero-wrap .page-header {
    background: var(--black);
    border-bottom: 4px solid var(--red);
  }
  .coaches-hero-wrap .section {
    background-image:
      url('assets/logo.png'),
      url('assets/pinstripe-tile.png');
    background-repeat: no-repeat, repeat;
    background-position: center center, 0 0;
    background-size: 85% auto, 48px 48px;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="Hart Hawks logo">
      <span class="brand-text">HART HAWKS<small>Baseball</small></span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu">Menu</button>
    <nav class="primary-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="schedule.html">Schedule</a></li>
        <li><a href="team.html">Team</a></li>
        <li><a href="coaches.html" class="active">Coaches</a></li>
        <li><a href="stats.html">Stats</a></li>
        <li class="has-dropdown">
          <a href="#">Hart Pride ▾</a>
          <div class="dropdown">
            <a href="photo-gallery.html">Photo Gallery</a>
            <a href="press-room.html">Press Room</a>
            <a href="alumni.html">Alumni</a>
            <a href="tradition-of-champions.html">Tradition of Champions</a>
            <a href="history.html">History</a>
            <a href="archived-clippings.html">Archived Clippings</a>
          </div>
        </li>
        <li class="has-dropdown">
          <a href="#">Support ▾</a>
          <div class="dropdown">
            <a href="dugout-club.html">Dugout Club</a>
            <a href="gear.html">Gear</a>
          </div>
        </li>
      </ul>
    </nav>
  </div>
</header>

<div class="coaches-hero-wrap">
  <div class="page-header">
    <div class="container">
      <h1>Coaches</h1>
      <p>The staff behind all three teams.</p>
    </div>
  </div>

  <div class="section">
    <div class="container">

      <div class="card-grid" id="coachGrid"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="coachModal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <img class="modal-photo" id="modalPhoto" src="" alt="">
    <div class="modal-role" id="modalRole"></div>
    <h3 id="modalName"></h3>
    <p id="modalBio"></p>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="brand-text" style="color:#fff;">HART HAWKS BASEBALL</div>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script>
  let COACH_DATA = [];

  document.addEventListener('DOMContentLoaded', async () => {
    COACH_DATA = await fetchSheet(SITE_CONFIG.sheets.coaches, 'data/sample-coaches.csv');
    const grid = document.getElementById('coachGrid');
    if (!COACH_DATA.length) {
      grid.innerHTML = '<p>Coach list not posted yet.</p>';
      return;
    }
    grid.innerHTML = COACH_DATA.map((c, i) => `
      <div class="coach-card">
        <div class="photo" style="background-image:url('${c.Photo}'); background-size:cover; background-position:center;"></div>
        <div class="body">
          <div class="role">${c.Team ? c.Team + ' · ' : ''}${c.Role || ''}</div>
          <h3>${c.Name || ''}</h3>
          <button class="btn-bio" data-index="${i}">Read bio →</button>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('.btn-bio').forEach(btn => {
      btn.addEventListener('click', () => openCoachModal(COACH_DATA[btn.dataset.index]));
    });

    document.getElementById('modalClose').addEventListener('click', closeCoachModal);
    document.getElementById('coachModal').addEventListener('click', (e) => {
      if (e.target.id === 'coachModal') closeCoachModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeCoachModal();
    });
  });

  function openCoachModal(c) {
    document.getElementById('modalPhoto').src = c.Photo || '';
    document.getElementById('modalPhoto').alt = c.Name || '';
    document.getElementById('modalRole').textContent = `${c.Team ? c.Team + ' · ' : ''}${c.Role || ''}`;
    document.getElementById('modalName').textContent = c.Name || '';
    document.getElementById('modalBio').textContent = c.Bio || '';
    document.getElementById('coachModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeCoachModal() {
    document.getElementById('coachModal').classList.remove('open');
    document.body.style.overflow = '';
  }
</script>
</body>
</html>
